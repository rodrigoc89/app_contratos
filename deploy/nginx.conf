# Same-origin server block for the comodato signing system (DESIGN.md §10).
#
# One origin serves both the PWA and the API. That is not a preference: it is
# what removes CORS from the design entirely, and it is what lets the tablet's
# service worker treat `/auth` and `/contratos` as "not mine" without a second
# hostname to configure (see `apps/web/src/pwa/configuracionPwa.ts`, whose
# navigation-fallback denylist is `[/^\/auth/, /^\/contratos/]`).
#
# ─────────────────────────────────────────────────────────────────────────────
# This file is a TEMPLATE, not an installable config. `__CONTRATOS_HOST__`
# and `__WEB_ROOT__` are rendered by `deploy/tls-bootstrap.sh`, which also
# orders the install correctly: the 443 block below names certificate paths
# that do not exist on a fresh host, so nginx refuses to start if this file
# is installed first. `deploy/nginx-bootstrap.conf` serves ACME over HTTP
# until certbot has issued the certificate.
#
# Install (never `cp` this file directly — an unrendered placeholder would
# become a literal server_name):
#   sudo CONTRATOS_HOST=<hostname> deploy/tls-bootstrap.sh
#
# The API is expected on 127.0.0.1:3000 (`PORT`, default 3000 in
# `apps/api/src/config/configuracion.ts`) under a process manager with
# restart-on-failure. It must NOT be reachable from outside; only this proxy
# should talk to it.
# ─────────────────────────────────────────────────────────────────────────────

upstream api_contratos {
    server 127.0.0.1:3000;
    keepalive 16;
}

# Plain HTTP exists only to answer ACME challenges and to redirect. A técnico
# who types the address without a scheme must not land on an unencrypted page
# where a customer's DNI would travel in the clear.
server {
    listen 80;
    listen [::]:80;
    server_name __CONTRATOS_HOST__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # HTTP/2 as a `listen` parameter, not the standalone `http2 on;`
    # directive. Ubuntu 22.04 LTS — the host we deploy on — ships nginx
    # 1.18, and `http2 on;` only exists from nginx 1.25.1: on 1.18 the
    # hard-gate `nginx -t` fails with `unknown directive "http2"` and
    # tls-bootstrap.sh rolls back to the HTTP-only 503 conf. 1.25+ still
    # accepts the parameter form (with a deprecation warning, not an error),
    # so this is the one spelling that works on both.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __CONTRATOS_HOST__;

    ssl_certificate     /etc/letsencrypt/live/__CONTRATOS_HOST__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__CONTRATOS_HOST__/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── The single most important line in this file ──────────────────────────
    # A `POST /contratos/:id/firmar` carries TWO signatures, each with an inline
    # PNG of up to 400,000 characters (`LARGO_MAXIMO_IMAGEN_FIRMA`) plus its raw
    # stroke data. The API accepts 2 MB (`LIMITE_CUERPO` in
    # `apps/api/src/http/configuracionHttp.ts`); nginx's default is 1 MB.
    #
    # Leaving the default means nginx answers 413 and the request never reaches
    # Node — the técnico sees a failure AFTER the customer has already signed
    # both documents, standing in their house. Keep this at or above the API's
    # own limit so the API's error, which is a proper JSON envelope the client
    # knows how to display, is always the one that wins.
    client_max_body_size 2m;

    # Same reasoning: do not let a slow tablet uplink time out mid-upload.
    client_body_timeout 60s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── Security headers, and the nginx trap that hides them ─────────────────
    # `add_header` is inherited from the enclosing block ONLY while the inner
    # block declares no `add_header` of its own. The moment a location adds one
    # — a `Cache-Control`, say — it silently loses every header declared here,
    # `always` included.
    #
    # That is why the three below are repeated verbatim inside each location
    # that sets its own. Measured on nginx 1.28.3 before the repetition existed:
    # `/index.html`, `/sw.js`, `/assets/*` and every client route answered with
    # `Cache-Control` and nothing else. `/login` reaches `location = /index.html`
    # through the `try_files` fallback, so the app shell — the page a customer
    # signs on — was served frameable on every route the tablet uses.
    #
    # If you add a location with an `add_header`, copy these three into it.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    root __WEB_ROOT__;
    index index.html;

    # ── API ──────────────────────────────────────────────────────────────────
    # These three prefixes are the whole server surface: `@Controller("auth")`,
    # `@Controller(RUTA_CONTRATOS)` (= "contratos") and `@Controller("salud")`.
    # Anything else belongs to the PWA. Keep this list in sync with the service
    # worker's denylist — if they disagree, the service worker will try to
    # answer an API navigation with `index.html`.
    location ^~ /auth {
        proxy_pass http://api_contratos;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location ^~ /contratos {
        proxy_pass http://api_contratos;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Sealed PDFs are rendered server-side with Puppeteer through a
        # concurrency-1..2 queue (DESIGN.md §10 operational guardrails), so a
        # document request can legitimately wait behind another render. The
        # 60s default is not enough head-room for that on a modest VPS.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location = /salud {
        proxy_pass http://api_contratos;
        include /etc/nginx/proxy_params;
        access_log off;
    }

    # ── PWA ──────────────────────────────────────────────────────────────────
    # The service worker must never be cached by the browser or an intermediary.
    # If a stale `sw.js` is served, the tablet keeps running the old app and the
    # update prompt this project deliberately built (`registerType: "prompt"`,
    # suppressed while work is in progress) can never fire.
    location = /sw.js {
        # Repeated, not inherited — see the note above the server-level block.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;

        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires off;
    }

    # Same for the entry document: it is what points at the hashed bundles.
    location = /index.html {
        # Repeated, not inherited. This location also answers every client
        # route (`/login`, `/panel`, `/panel/contratos/:id`) through the
        # `try_files` fallback below, so dropping them here drops them from the
        # whole application.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;

        add_header Cache-Control "no-cache" always;
        expires off;
    }

    # The web app manifest is what makes the PWA installable on the tablet, and
    # nginx's stock `mime.types` has no entry for `.webmanifest` — so without
    # this block it is served with `default_type`, `application/octet-stream`.
    # Worse, the server-level `X-Content-Type-Options: nosniff` above then
    # forbids the browser from recovering the real type by sniffing. Chrome
    # installs the app anyway today, but that is its tolerance, not a
    # guarantee; the spec asks for `application/manifest+json`.
    #
    # ── The `types` trap, the sibling of the `add_header` one above ──────────
    # A `types` block REPLACES the inherited map instead of extending it. At
    # `server` level this would drop `mime.types` for the whole origin and send
    # every stylesheet, script and icon out as `application/octet-stream`. It
    # is scoped to this exact-match location, where the only file it can ever
    # apply to is the manifest itself.
    #
    # No `add_header` here on purpose: that keeps the three security headers
    # inherited from the server block. Adding one means copying all three in.
    location = /manifest.webmanifest {
        types {
            application/manifest+json webmanifest;
        }
    }

    # Vite emits content-hashed filenames, so these are safe to cache hard —
    # a new build produces new names rather than new content at the same name.
    location /assets/ {
        # Repeated, not inherited.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;

        # `expires 1y` is deliberately gone: it emits a `Cache-Control` of its
        # own, so together with the line below every asset went out carrying
        # two conflicting `Cache-Control` headers. One explicit header, stating
        # exactly what is meant.
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        access_log off;
    }

    # SPA fallback, last. Everything not matched above is a client route
    # (`/login`, `/`) and must be answered with the app shell so a técnico who
    # reloads mid-visit does not get a 404 from nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
