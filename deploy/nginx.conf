# Same-origin server block for the comodato signing system (DESIGN.md §10).
#
# One origin serves both the PWA and the API. That is not a preference: it is
# what removes CORS from the design entirely, and it is what lets the tablet's
# service worker treat `/auth` and `/contratos` as "not mine" without a second
# hostname to configure (see `apps/web/src/pwa/configuracionPwa.ts`, whose
# navigation-fallback denylist is `[/^\/auth/, /^\/contratos/]`).
#
# ─────────────────────────────────────────────────────────────────────────────
# Before installing, replace:
#   - `contratos.iesnet.com.ar`  → the real hostname
#   - `/var/www/contratos`       → where `apps/web/dist` is deployed
#   - the certificate paths, if certbot places them elsewhere
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/contratos
#   sudo ln -s /etc/nginx/sites-available/contratos /etc/nginx/sites-enabled/
#   sudo nginx -t          # must pass before reloading
#   sudo systemctl reload nginx
#
# The API is expected on 127.0.0.1:3000 (`PORT`, default 3000 in
# `apps/api/src/config/configuracion.ts`) under a process manager with
# restart-on-failure. It must NOT be reachable from outside; only this proxy
# should talk to it.
# ─────────────────────────────────────────────────────────────────────────────

upstream api_contratos {
    server 127.0.0.1:3000;
    keepalive 16;
}

# Plain HTTP exists only to answer ACME challenges and to redirect. A técnico
# who types the address without a scheme must not land on an unencrypted page
# where a customer's DNI would travel in the clear.
server {
    listen 80;
    listen [::]:80;
    server_name contratos.iesnet.com.ar;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name contratos.iesnet.com.ar;

    ssl_certificate     /etc/letsencrypt/live/contratos.iesnet.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/contratos.iesnet.com.ar/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── The single most important line in this file ──────────────────────────
    # A `POST /contratos/:id/firmar` carries TWO signatures, each with an inline
    # PNG of up to 400,000 characters (`LARGO_MAXIMO_IMAGEN_FIRMA`) plus its raw
    # stroke data. The API accepts 2 MB (`LIMITE_CUERPO` in
    # `apps/api/src/http/configuracionHttp.ts`); nginx's default is 1 MB.
    #
    # Leaving the default means nginx answers 413 and the request never reaches
    # Node — the técnico sees a failure AFTER the customer has already signed
    # both documents, standing in their house. Keep this at or above the API's
    # own limit so the API's error, which is a proper JSON envelope the client
    # knows how to display, is always the one that wins.
    client_max_body_size 2m;

    # Same reasoning: do not let a slow tablet uplink time out mid-upload.
    client_body_timeout 60s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    root /var/www/contratos;
    index index.html;

    # ── API ──────────────────────────────────────────────────────────────────
    # These three prefixes are the whole server surface: `@Controller("auth")`,
    # `@Controller(RUTA_CONTRATOS)` (= "contratos") and `@Controller("salud")`.
    # Anything else belongs to the PWA. Keep this list in sync with the service
    # worker's denylist — if they disagree, the service worker will try to
    # answer an API navigation with `index.html`.
    location ^~ /auth {
        proxy_pass http://api_contratos;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location ^~ /contratos {
        proxy_pass http://api_contratos;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Sealed PDFs are rendered server-side with Puppeteer through a
        # concurrency-1..2 queue (DESIGN.md §10 operational guardrails), so a
        # document request can legitimately wait behind another render. The
        # 60s default is not enough head-room for that on a modest VPS.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location = /salud {
        proxy_pass http://api_contratos;
        include /etc/nginx/proxy_params;
        access_log off;
    }

    # ── PWA ──────────────────────────────────────────────────────────────────
    # The service worker must never be cached by the browser or an intermediary.
    # If a stale `sw.js` is served, the tablet keeps running the old app and the
    # update prompt this project deliberately built (`registerType: "prompt"`,
    # suppressed while work is in progress) can never fire.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires off;
    }

    # Same for the entry document: it is what points at the hashed bundles.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        expires off;
    }

    # Vite emits content-hashed filenames, so these are safe to cache hard —
    # a new build produces new names rather than new content at the same name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    # SPA fallback, last. Everything not matched above is a client route
    # (`/login`, `/`) and must be answered with the app shell so a técnico who
    # reloads mid-visit does not get a 404 from nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
