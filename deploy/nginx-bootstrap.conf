# HTTP-only bootstrap server block (design.md D6) — installed BEFORE any
# certificate exists, so nginx has something valid to serve while
# `deploy/tls-bootstrap.sh` runs its first ACME challenge. Once that script
# obtains a certificate, it repoints `/etc/nginx/sites-enabled` to the
# rendered `deploy/nginx.conf` and this file stops being the active site —
# it stays on disk on purpose, as the rollback target `tls-bootstrap.sh`
# repoints back to if the full conf ever fails `nginx -t`.
#
# `return 503`, not a redirect to https: an origin with no certificate has
# nothing to redirect to. A `301` there is a dead end that also hides which
# state the host is in — a 503 states it plainly.
#
# No hostname placeholder here: this file is installed as-is, never
# rendered as a template — unlike `deploy/nginx.conf`, whose `__CONTRATOS_HOST__`
# / `__WEB_ROOT__` tokens only matter once a real site exists to serve.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 503;
    }
}
