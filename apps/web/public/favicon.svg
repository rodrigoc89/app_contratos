<?xml version="1.0" encoding="UTF-8"?>
<!--
  DESIGN.md D5 — favicon. A simplified variant of `apps/web/marca/ies-
  monograma.svg`: tighter letter-spacing and a larger glyph-to-canvas ratio
  than the master source, because the browser tab renders this at ~16px,
  where three letters are only ~5px wide each. Legibility at 16px is the
  criterion here, not fidelity to the full mark.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" fill="#008bff" />
  <text
    x="16"
    y="21.5"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-weight="800"
    font-size="15"
    fill="#ffffff"
  >IES</text>
</svg>
