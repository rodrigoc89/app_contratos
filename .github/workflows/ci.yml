name: CI

on:
  # No `branches:` filter, deliberately. A bare `branches: [master]` silently
  # skips every slice of a chained PR, which target the previous PR's branch:
  # the work reaches a reviewer with no typecheck, no lint and no tests behind
  # it. That was first hit by the `production-deployment` chain and patched
  # with an allowlist naming that chain's own branches — which failed again
  # the very next time, on `feat/brand-identity`, because an enumerated list
  # is a fix that needs maintenance to keep working and reports nothing when
  # it stops. There is no pull request worth merging without CI, so every
  # pull request gets it regardless of its base.
  pull_request:
  push:
    branches: [master]

# A newer push to the same branch makes the in-flight run obsolete, so cancel
# it instead of paying for a result nobody will read. Runs on master are keyed
# by their own ref, so a merge never cancels a PR run or vice versa.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only: nothing in this workflow writes to the repository or publishes
# anything. No repository secret is used, requested, or needed.
permissions:
  contents: read

jobs:
  verify:
    name: Typecheck and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      # Not a secret, and nothing in this job connects to it: no database is
      # started here. It exists only because `apps/api/prisma.config.ts`
      # resolves `DATABASE_URL` eagerly at config-load time, so even
      # `prisma generate` — which is purely offline codegen — refuses to run
      # when the variable is unset.
      DATABASE_URL: postgresql://contratos:contratos@127.0.0.1:5432/contratos

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        # Version comes from `packageManager` in the root package.json.
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          # `engines.node` is ">=22", but the web suite does not actually pass
          # on Node 22: three `clienteHttp` Blob tests fail there. Node 24 is
          # the current Active LTS and is green across every package, so CI
          # pins it rather than the declared floor.
          node-version: 24
          # Caches the pnpm content-addressable store, keyed on pnpm-lock.yaml.
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate the Prisma client
        # `apps/api/generated/` is git-ignored and no install hook creates it,
        # so typecheck cannot resolve `generated/prisma/client` without this.
        # Offline codegen — it never contacts a database.
        run: pnpm --filter @contratos/api prisma:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        # `apps/api/vitest.config.ts` excludes `*.integration.spec.ts`, so this
        # stays database-free and browser-free; integration runs in its own job.
        run: pnpm -r test

  lint:
    name: ESLint
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      # Same reason as `verify` above: not a secret, nothing connects to it,
      # and it exists only so `apps/api/prisma.config.ts` stops refusing to
      # load before the offline `prisma generate` below.
      DATABASE_URL: postgresql://contratos:contratos@127.0.0.1:5432/contratos

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate the Prisma client
        # Type-aware linting resolves the same imports typecheck does, so it
        # needs `generated/prisma/client` to exist for exactly the reason the
        # `verify` job does. Without it, every `apps/api` file that touches
        # Prisma types lints against `any` and the type-aware rules go quiet
        # instead of failing — a silent loss of coverage, not an error.
        run: pnpm --filter @contratos/api prisma:generate

      - name: Lint
        # `--max-warnings 0` is inside the `lint` script: every rule in
        # eslint.config.mjs is `error`, and a warning here would mean a rule
        # was quietly downgraded rather than fixed.
        run: pnpm lint

      - name: Install shellcheck
        # Installed explicitly rather than relying on the runner image: the
        # image ships it today, but a check whose presence is incidental is
        # a check that can disappear without anything going red.
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Shellcheck the deploy scripts
        # Runs the same `lint:shell` script a developer runs, so there is one
        # definition of what "shellcheck passes" means. eslint does not read
        # shell, so before this step roughly 2000 lines of bash across seven
        # scripts — the ones that stop the service, publish the site and
        # prune the backups — had no linter over them at all.
        run: pnpm --filter @contratos/deploy lint:shell

  integration:
    name: Integration tests (Postgres and Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        # Same major as docker-compose.yml at the repo root.
        image: postgres:17-alpine
        env:
          POSTGRES_USER: contratos
          POSTGRES_PASSWORD: contratos
          POSTGRES_DB: contratos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contratos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Points at this job's own service container, written inline on purpose:
      # a throwaway database that exists only for the length of this run holds
      # nothing worth protecting, so it must not go through repository secrets.
      DATABASE_URL: postgresql://contratos:contratos@127.0.0.1:5432/contratos

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install fontconfig and poppler-utils
        # `verificarRender.integration.spec.ts` runs the three-layer render
        # verdict (design.md D2) against the real `fc-match`, `pdffonts` and
        # `pdftotext`. It is written to stay correct when a tool is absent —
        # which means that without this step, whether the verdict is exercised
        # at all here depends on whatever the runner image happens to ship,
        # and losing a tool would drop the coverage silently rather than
        # failing. Installed explicitly so the spec can require all three.
        run: sudo apt-get update && sudo apt-get install -y fontconfig poppler-utils

      - name: Restore the Puppeteer browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium for Puppeteer
        # Required, and deliberately not left to the install hook: with a warm
        # pnpm store, `pnpm install` does not re-run puppeteer's postinstall,
        # and the browser lives in ~/.cache/puppeteer rather than in the store
        # — so the download can silently not happen. This command is explicit
        # and idempotent: a no-op when the cache above already restored it.
        run: pnpm --filter @contratos/api exec puppeteer browsers install chrome

      - name: Generate the Prisma client
        run: pnpm --filter @contratos/api prisma:generate

      - name: Apply database migrations
        run: pnpm --filter @contratos/api prisma:migrate:deploy

      - name: Install the PostgreSQL 17 client
        # `deploy/backup.integration.spec.ts` runs `backup.sh` for real, and
        # `backup.sh` calls `pg_dump` on the host. pg_dump refuses to dump a
        # server newer than itself, and the service container above is
        # Postgres 17, so the runner image's own client is not enough — this
        # is the same PGDG repository `deploy/provision.sh` adds on the VPS,
        # which also keeps the client here matching the one in production.
        run: |
          sudo install -d -m 755 /etc/apt/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo tee /etc/apt/keyrings/postgresql.asc > /dev/null
          echo "deb [signed-by=/etc/apt/keyrings/postgresql.asc] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          # Debian's /usr/bin/pg_dump is pg_wrapper, which picks a version
          # from the default cluster — and this image already ships
          # postgresql-client-16, so installing 17 alone leaves `pg_dump` on
          # $PATH at 16.15, which refuses to dump a 17 server. Verified: the
          # first run of this step failed exactly that way. Put 17's own bin
          # directory first and prove which binary won.
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Confirm pg_dump matches the server major version
        run: |
          pg_dump --version
          test "$(pg_dump --version | grep -oE '[0-9]+' | head -1)" = "17"

      - name: Deploy script integration tests
        # Proves `backup.sh` completes its pg_dump BEFORE the PDF copy begins
        # by observing a real run (contract-archive-backup spec.md). The
        # dry-run suite in `pnpm -r test` asserts only the order of the plan
        # strings, which stays green even with the two calls swapped.
        run: pnpm --filter @contratos/deploy test:integration

      - name: Integration tests
        # These specs TRUNCATE their tables between cases, which is safe only
        # because DATABASE_URL above points at this run's disposable service
        # container and never at a developer or production database.
        #
        # Nothing is uploaded from this job on success or on failure: the suite
        # renders real contract PDFs (names, DNIs, signature images), and a
        # test artifact is exactly the wrong place for Ley 25.326 data. The
        # step log is the whole diagnostic surface, by design.
        run: pnpm --filter @contratos/api test:integration

  bundle:
    name: dist/ size ceiling, compiled-output guards and handheld geometry
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # No `needs:` — this job is independent of `verify`/`lint`/`integration`
    # and serialising them buys nothing (design.md D7 "New CI job").

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          # Jobs get fresh runners, so this pnpm store cache is this job's
          # own — it does not inherit `verify`'s or `integration`'s.
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build apps/web
        # No other job in this workflow runs `vite build` — this job exists
        # because the ceiling and the compiled-output guards (guards 1, 2
        # and 16, landing in PR6) both need a real `dist/`.
        run: pnpm --filter @contratos/web build

      - name: Check the dist/ size ceiling
        # design.md D7 — fails closed on a missing/empty/undersized dist/,
        # and on a build over 650 KiB (665,600 raw bytes). Runs before the
        # compiled-CSS scan so a breach fails in about a second.
        run: pnpm --filter @contratos/web size

      - name: Compiled-output style guards
        # design.md D2 — guards 1, 2 and 16, scanned against the real
        # compiled CSS. Currently an empty skeleton from PR3 (real
        # assertions land in PR6); kept in this job's step order now so the
        # job's shape is stable once PR6 fills it in.
        run: pnpm --filter @contratos/web test:compilado

      - name: Restore the Puppeteer browser cache
        # design.md D8 / D7 "New CI job" — this job's own cache, independent
        # of the `integration` job's: jobs get fresh runners, so nothing
        # here is inherited from `ci.yml:187-191`.
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium for Puppeteer
        # Same reasoning as the `integration` job's own install step
        # (`ci.yml:193-199`): a warm pnpm store does not re-run puppeteer's
        # postinstall, so the browser download can silently not happen
        # without this. Idempotent — a no-op when the cache above already
        # restored it.
        run: pnpm --filter @contratos/web exec puppeteer browsers install chrome

      - name: Handheld geometry harness
        # design.md D8 — real Puppeteer over `vite preview` serving the
        # `dist/` built above, intercepted `/auth/*`/`/contratos/*` fixtures,
        # no API and no Postgres. Placed last in this job's step order
        # (design.md D7: "ceiling → compiled-CSS guards → browser, so a
        # breach fails in about a second without paying for Chrome") — a
        # step failure above already stops the job before this one runs.
        run: pnpm --filter @contratos/web handheld
